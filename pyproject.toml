[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "refund-sentinel"
version = "0.1.0"
description = "Sandbox-only AI refund incident responder using Agentic Intent Gate"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "agentic-intent-gate @ git+https://github.com/miku-wwl/agentic-intent-gate.git@7261fdd2f47d2b15fabe8faac527eeee37338eb1",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[project.scripts]
refund-sentinel = "refund_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refund_sentinel = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
